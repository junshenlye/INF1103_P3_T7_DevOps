services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stackplan}
      POSTGRES_USER: ${POSTGRES_USER:-stackplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackplan_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stackplan} -d ${POSTGRES_DB:-stackplan}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    # Test-only storage. Restarting or stopping this container clears the database.
    tmpfs:
      - /var/lib/postgresql/data:rw,size=256m
