services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATA_FILE: /app/data/schedules.json
      MODULE_FILE: /app/data/modules.json
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true
  web:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint:
      - python
      - frontend-demo/app.py
    env_file:
      - .env
    environment:
      DATA_FILE: /app/data/schedules.json
      MODULE_FILE: /app/data/modules.json
      PORT: 5000
    volumes:
      - ./data:/app/data
    ports:
      - "${WEB_PORT:-5050}:5000"
